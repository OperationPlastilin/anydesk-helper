# Скопируйте в config.toml и поправьте под себя. Все параметры необязательны.

[llm]
# --- Вариант 1 (бесплатно, локально): Ollama ---
# ollama pull qwen2.5vl:7b        (нужна видеокарта ~8 ГБ; на CPU будет очень медленно)
base_url = "http://localhost:11434/v1"
model = "qwen2.5vl:7b"
coords = "pixels"        # Qwen2.5-VL отвечает пикселями
# model = "qwen3-vl:8b"
# coords = "norm1000"    # Qwen3-VL отвечает координатами 0..1000

# --- Вариант 2: OpenRouter (есть бесплатные модели с суффиксом :free) ---
# base_url = "https://openrouter.ai/api/v1"
# model = "qwen/qwen2.5-vl-72b-instruct:free"   # актуальный список: openrouter.ai/models (поиск "qwen vl")
# api_key = "sk-or-..."   # или переменная окружения ANYDESK_HELPER_API_KEY
# coords = "pixels"

# --- Вариант 3: Alibaba Model Studio / DashScope (бесплатная квота для новых аккаунтов) ---
# base_url = "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
# model = "qwen-vl-max"
# api_key = "sk-..."
# coords = "pixels"       # для моделей qwen3-vl-* поставьте norm1000

temperature = 0.2
max_tokens = 1024
timeout = 180

[anydesk]
path = ""                # пусто — найти AnyDesk.exe автоматически
connect_timeout = 90     # сколько секунд ждать, пока клиент примет подключение
window_title = ""        # подстрока заголовка окна сеанса, если автопоиск по ID не срабатывает

[agent]
max_steps = 60
confirm = "risky"        # all — подтверждать каждое действие, risky — только опасные, none — ничего
language = "Russian"     # на каком языке ИИ пишет мысли и вопросы
screenshot_max_side = 1288
step_delay = 1.5         # пауза после каждого действия, сек
typing = "clipboard"     # clipboard — вставка через буфер (кириллица, любая раскладка); keys — посимвольно (только латиница)
history = 15
log_dir = "logs"
playbooks_dir = "playbooks"
