name: Release

# Новая версия — любой из способов:
#   1) git tag v0.3.1 && git push origin v0.3.1
#   2) GitHub -> Actions -> Release -> Run workflow, поле «version»: 0.3.1 (тег создастся сам)
# Сборка создаст релиз с AnyDeskHelper.exe — установленные программы обновятся при перезапуске.
# Run workflow с пустой версией — только проверочная сборка, без публикации.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия релиза, например 0.3.1 (пусто — только проверочная сборка)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set version
        if: github.ref_type == 'tag' || inputs.version != ''
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: |
          $v = $env:TAG.Trim().TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Версия должна быть вида 1.2.3, а не '$v'" }
          $file = "anydesk_helper/version.py"
          (Get-Content $file -Raw) -replace '__version__ = "[^"]*"', "__version__ = `"$v`"" | Set-Content $file -NoNewline
          Get-Content $file

      - name: Install dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.9" pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Build exe
        shell: pwsh
        run: ./build.ps1

      - name: Smoke test exe
        shell: pwsh
        run: |
          $p = Start-Process dist/AnyDeskHelper.exe -ArgumentList "--no-browser", "--no-update", "--port", "8799" -PassThru
          $ok = $false
          # «/» и API отдаются только с токеном: программа кладёт его в %LOCALAPPDATA%\AnyDeskHelper\token.
          $tokenFile = Join-Path $env:LOCALAPPDATA "AnyDeskHelper\token"
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep 2
            try {
              $t = (Get-Content $tokenFile -Raw).Trim()
              $page = Invoke-WebRequest "http://127.0.0.1:8799/?t=$t" -UseBasicParsing
              $state = Invoke-RestMethod "http://127.0.0.1:8799/api/state" -Headers @{ "X-Token" = $t }
              $ok = $page.StatusCode -eq 200 -and $page.Content -match "AnyDesk Helper" -and $state.version
            } catch {}
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "exe не поднял веб-интерфейс" }
          Write-Host "exe работает, версия $($state.version)"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: AnyDeskHelper
          path: dist/AnyDeskHelper.exe*

      - name: Publish release
        if: github.ref_type == 'tag' || inputs.version != ''
        uses: softprops/action-gh-release@v2
        with:
          # При ручном запуске тега ещё нет — action создаст его на собранном коммите.
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/AnyDeskHelper.exe
            dist/AnyDeskHelper.exe.sha256
          generate_release_notes: true
