<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AnyDesk Helper</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2325c2a0'/%3E%3Cpath d='M9 11l6 5-6 5M17 22h7' stroke='%23111' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
<script>
  window.APP = { token: "__TOKEN__", version: "__VERSION__", dev: __DEV__ };
  try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "dark"; } catch (e) {}
</script>
</head>
<body>
<header class="navbar">
  <div class="navbar-inner">
    <a class="brand" href="#/">
      <span class="logo">&gt;_</span>
      <span class="brand-name">AnyDesk Helper</span>
      <span class="chip version" id="version"></span>
    </a>
    <nav class="tabs">
      <a href="#/tickets" data-tab="tickets">Тикеты <span class="count" id="tab-count"></span></a>
      <a href="#/kb" data-tab="kb">База опыта <span class="count" id="kb-count"></span></a>
      <a href="#/settings" data-tab="settings">Настройки</a>
    </nav>
    <div class="spacer"></div>
    <div class="agent-widget" id="agent-widget"></div>
    <a class="chip model-chip" id="model-chip" href="#/settings"></a>
    <a class="chip update-chip hidden" id="update-chip" href="#/settings"></a>
    <button class="icon-btn" id="theme-btn" title="Сменить тему" aria-label="Сменить тему"></button>
    <a class="icon-btn" href="https://github.com/OperationPlastilin/anydesk-helper" target="_blank" rel="noopener" title="GitHub" aria-label="GitHub">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
  <div class="run-line" id="run-line"></div>
</header>

<div class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <a class="btn primary block" href="#/new">+ Новый тикет</a>
    <div class="filters">
      <input type="search" id="search" placeholder="Поиск: текст, #номер, ID AnyDesk">
      <select id="status-filter" aria-label="Статус">
        <option value="">Все</option>
        <option value="new">Новые</option>
        <option value="running">В работе</option>
        <option value="waiting">Ждут ответа</option>
        <option value="solved">Решённые</option>
        <option value="failed">Не решённые</option>
        <option value="stopped">Остановленные</option>
      </select>
    </div>
    <nav id="ticket-list" class="ticket-list"></nav>
  </aside>
  <main id="main" class="main"></main>
</div>

<div id="lightbox" class="lightbox hidden"><img alt=""></div>
<div id="toast" class="toast hidden"></div>
<script src="/static/app.js"></script>
</body>
</html>
